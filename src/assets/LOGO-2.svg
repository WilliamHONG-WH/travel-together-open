<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90.71 90.7">
  <defs>
    <!-- SVG 蒙版：白色保留 / 黑色镂空 -->
    <mask id="logo-mountain-mask">
      <!-- 1. 全白背景：保留整个底座区域 -->
      <rect width="90.71" height="90.7" fill="#ffffff" />
      <!-- 2. 中间山峰负空间：填纯黑 #000000，在白色底座上直接挖掉这块区域 -->
      <path d="m90.71,45.35v22.68c-8.26,0-16,2.21-22.67,6.06-6.67-3.85-14.42-6.06-22.68-6.06s-16.01,2.21-22.68,6.06c-6.67-3.85-14.42-6.06-22.68-6.06v-22.68c25.05,0,45.35-20.3,45.36-45.35.01,25.05,20.3,45.35,45.35,45.35Z" fill="#000000" />
    </mask>
  </defs>

  <!-- 应用蒙版的纯白外框底座：被 mask 扣掉的山峰区域将变成绝对透明 (alpha 0) -->
  <g mask="url(#logo-mountain-mask)">
    <!-- 1. 底部装饰带 -->
    <path fill="#ffffff" d="m90.71,68.03v8.5c0,7.8-6.37,14.17-14.17,14.17H14.18c-7.8,0-14.18-6.37-14.18-14.17v-8.5c8.26,0,16.01,2.21,22.68,6.06,6.67-3.85,14.42-6.06,22.68-6.06s16.01,2.21,22.68,6.06c6.67-3.85,14.41-6.06,22.67-6.06Z" />
    <!-- 2. 右上角装饰 -->
    <path fill="#ffffff" d="m90.71,14.17v31.18c-25.05,0-45.34-20.3-45.35-45.35h31.18c7.8,0,14.17,6.37,14.17,14.17Z" />
    <!-- 3. 左下角装饰 -->
    <path fill="#ffffff" d="m14.18,0h31.18c-.01,25.05-20.31,45.35-45.36,45.35V14.17C0,6.37,6.38,0,14.18,0Z" />
  </g>
</svg>
